name: Supabase-Erreichbarkeit prüfen

on:
  schedule:
    - cron: '43 13 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: supabase-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://eljfnqmxpmqgafeiksxi.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Datenbank über die Supabase-API prüfen
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo '::error::SUPABASE_PUBLISHABLE_KEY fehlt in GitHub Secrets.'
            exit 1
          fi
          if ! curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 20 \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --output "$RUNNER_TEMP/aze-health.json" "$SUPABASE_URL/rest/v1/rpc/aze_healthcheck"; then
            echo '::error::Supabase ist nicht erreichbar oder die Migration für aze_healthcheck fehlt.'
            exit 1
          fi
          if ! jq --exit-status '. == true' "$RUNNER_TEMP/aze-health.json" >/dev/null; then
            echo '::error::Unerwartete Antwort von aze_healthcheck.'
            exit 1
          fi
          echo 'Supabase-Datenbank ist erreichbar.'
